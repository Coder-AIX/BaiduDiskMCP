name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        name: Build ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: windows-x64
                      os: windows-latest
                      script: package:win
                      artifact: win-x64
                      path: release/*win-x64.zip
                    - name: linux-x64
                      os: ubuntu-latest
                      script: package:linux
                      artifact: linux-x64
                      path: release/*linux-x64.tar.gz
                    - name: linux-arm64
                      os: ubuntu-24.04-arm
                      script: package:linux
                      artifact: linux-arm64
                      path: release/*linux-arm64.tar.gz
                    - name: macos-arm64
                      os: macos-15
                      script: package:macos
                      artifact: macos-arm64
                      path: release/*macos-arm64.tar.gz
                    - name: macos-x64
                      os: macos-15-intel
                      script: package:macos
                      artifact: macos-x64
                      path: release/*macos-x64.tar.gz

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Build package
              run: npm run ${{ matrix.script }}

            - name: Verify tag matches package version
              if: startsWith(github.ref, 'refs/tags/')
              shell: bash
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  test "v$VERSION" = "$GITHUB_REF_NAME"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.path }}
                  if-no-files-found: error

    release:
        name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release
                  merge-multiple: true

            - name: Generate checksums
              shell: bash
              run: |
                  cd release
                  sha256sum *.zip *.tar.gz > SHA256SUMS.txt
                  cat SHA256SUMS.txt

            - name: Publish release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      release/*.zip
                      release/*.tar.gz
                      release/SHA256SUMS.txt
                  generate_release_notes: true
